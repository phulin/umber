[package]
name = "tex-state-benchmarks"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
criterion = "0.5"
tex-command = { path = "../../crates/tex-command" }
tex-exec = { path = "../../crates/tex-exec" }
tex-state = { path = "../../crates/tex-state", features = ["profiling", "testing"] }
umber = { path = "../../crates/umber" }

[[bench]]
name = "state_budgets"
harness = false

[[bench]]
name = "accepted_edit_scaling"
harness = false
