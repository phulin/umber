[package]
name = "tex-exec-benchmarks"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[profile.profiling]
inherits = "release"
debug = 2
strip = false

[dependencies]
criterion = "0.5"
stats_alloc = "0.1"
tex-arith = { path = "../../crates/tex-arith" }
tex-command = { path = "../../crates/tex-command" }
tex-exec = { path = "../../crates/tex-exec" }
tex-fonts = { path = "../../crates/tex-fonts" }
tex-out = { path = "../../crates/tex-out" }
tex-state = { path = "../../crates/tex-state" }

[[bin]]
name = "native_batch"
path = "src/bin/native_batch.rs"

[[bench]]
name = "shipout"
harness = false
