[package]
name = "texlive-wasm-publish"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
umber-distribution = { path = "../../crates/umber-distribution" }
umber-hash = { path = "../../crates/umber-hash" }

[dev-dependencies]
tempfile = "3"
test-support = { path = "../../crates/test-support" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
