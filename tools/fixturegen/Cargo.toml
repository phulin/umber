[package]
name = "fixturegen"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1"
bib-engine = { path = "../../crates/bib-engine" }
corpus-manifest = { path = "../../crates/corpus-manifest" }
parity-harness = { path = "../parity-harness", features = ["reference-tools"] }
pdf-writer = "=0.15.0"
refexec = { path = "../refexec" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
test-support = { path = "../../crates/test-support" }
tex-arith = { path = "../../crates/tex-arith" }
tex-command = { path = "../../crates/tex-command" }
tex-fonts = { path = "../../crates/tex-fonts" }
tex-state = { path = "../../crates/tex-state" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[patch.crates-io]
pdf-writer = { git = "https://github.com/phulin/pdf-writer.git", rev = "030c3b1ad0e528b13ee3e6ca4605c91fbeaa3d91" }
