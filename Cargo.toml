[workspace]
members = [
  "crates/*",
  "tools/parity-harness",
  "tools/profile-analyzer",
  "tools/refexec",
  "tools/tex-command-stream",
]
default-members = [
  "crates/corpus-manifest",
  "crates/test-support",
  "crates/tex-arith",
  "crates/tex-command",
  "crates/tex-content",
  "crates/tex-exec",
  "crates/tex-expand",
  "crates/tex-fonts",
  "crates/tex-incr",
  "crates/tex-lex",
  "crates/tex-out",
  "crates/tex-oracle",
  "crates/tex-shape",
  "crates/tex-state",
  "crates/tex-typeset",
  "crates/umber",
  "crates/umber-distribution",
  "crates/umber-fetch",
  "crates/umber-vfs",
  "tools/parity-harness",
  "tools/tex-command-stream",
]
exclude = [
  "tools/corpus-sync",
  "tools/fixturegen",
  "tools/texlive-wasm-publish",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ahash = "0.8"
anyhow = "1"
bincode = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1"
hayro-syntax = { git = "https://github.com/phulin/hayro.git", rev = "abf6c167f6b877a18a077b9ff76dad36573e271d", default-features = false, features = ["std", "unsafe"] }
md-5 = "0.10"
pdf-writer = { git = "https://github.com/phulin/pdf-writer.git", rev = "030c3b1ad0e528b13ee3e6ca4605c91fbeaa3d91" }
png = "0.18.1"
posix-regex = "0.1.4"
proptest = "1"
quick-xml = "0.38"
rustybuzz = "0.20.1"
self_cell = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
smallvec = "1.15"
subsetter = { version = "0.2.6", default-features = false }
tempfile = "3"
unicode-bidi = "0.3.18"
unicode-script = "0.5.8"
unicode-width = "0.2"

[profile.dev]
debug = "line-tables-only"

[profile.test]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = 2
strip = false

[profile.release.package.umber-wasm]
opt-level = "s"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
# The `clippy.toml` host-I/O and clock policy is denied here rather than left at
# clippy's warn default so its severity is a property of the workspace instead of
# a property of the command line. A bare `cargo clippy` exits 0 on warnings, so
# with the policy at warn level an agent could run clippy, see success, and still
# land a violation that `scripts/check.sh`'s `-D warnings` rejects. Manifest lint
# levels also participate in Cargo's fingerprint, so a cached clean check cannot
# be replayed under a stricter command line.
disallowed_methods = "deny"
todo = "deny"
unwrap_used = "deny"
