name: Deferred tiers

# The named tiers the routine gate cannot run: they need wasm-pack, a headless
# browser, ripgrep, HarfBuzz, live LaTeX inputs, and dependency trees outside
# the workspace lockfile.
#
# Before umber2-johp.213 this file ran check-wasm.sh behind a path filter and
# nothing at all ran check-tools.sh, so the coverage run-native-tests.py hands
# to those tiers was asserted by a comment and executed by nobody. Both tiers
# run here now, and both end in a VERDICT line naming the steps that ran, so a
# green job is a statement about what happened rather than about what failed to
# complain.
#
# The path filters are gone deliberately. A filter decides in advance which
# changes could possibly break a tier, which is the same class of guess that
# left tools/tex-command-stream rotted out of compiling (umber2-johp.121).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a tree nobody has pushed to still has a dated answer.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  wasm:
    name: check-wasm.sh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: "152.0"
      - uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "149"
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Install dprint
        run: npm install --global dprint@0.55.2
      - name: Native quality gate
        run: scripts/check-and-test.sh
      - name: Test optimized package in Firefox and Chrome
        run: CHROME="$(command -v chrome)" CHROME_NO_SANDBOX=1 scripts/check-wasm.sh

  tools:
    name: check-tools.sh
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy
      # arxiv-entrypoint is the one step with a tool prerequisite the runner
      # image does not reliably carry. Installing it here, rather than letting
      # the step report BLOCKED, is the point of running the tier on a machine
      # whose contents we control.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Host tool tier
        run: scripts/check-tools.sh

  hb-shape:
    name: check-hb-shape-fixtures.sh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # `hb-shape` is the C HarfBuzz oracle for this cross-check. Installing
      # it explicitly keeps a missing executable from becoming a green skip.
      - name: Install HarfBuzz command-line tools
        run: sudo apt-get update && sudo apt-get install -y libharfbuzz-bin
      - name: HarfBuzz shape-fixture tier
        run: scripts/check-hb-shape-fixtures.sh
