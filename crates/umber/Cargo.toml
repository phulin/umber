[package]
name = "umber"
version.workspace = true
edition.workspace = true

[[bin]]
name = "gentle-profile"
path = "src/bin/gentle_profile.rs"
required-features = ["profiling-runner"]
test = false
bench = false

[[bin]]
name = "distribution-startup-benchmark"
path = "src/bin/distribution_startup_benchmark.rs"
test = false
bench = false

[[bin]]
name = "distribution-verify"
path = "src/bin/distribution_verify.rs"
test = false
bench = false

[features]
default = []
shadow = ["tex-state/shadow"]
profiling-runner = ["dep:test-support"]
profiling = ["tex-exec/profiling", "tex-state/profiling"]

[dependencies]
bib-engine = { path = "../bib-engine" }
flate2.workspace = true
hayro-syntax.workspace = true
md-5.workspace = true
png.workspace = true
sha2.workspace = true
test-support = { path = "../test-support", optional = true }
tex-arith = { path = "../tex-arith" }
tex-command = { path = "../tex-command" }
tex-exec = { path = "../tex-exec" }
tex-fonts = { path = "../tex-fonts" }
tex-incr = { path = "../tex-incr" }
tex-observe = { path = "../tex-observe" }
tex-oracle = { path = "../tex-oracle" }
tex-out = { path = "../tex-out" }
tex-state = { path = "../tex-state" }
umber-distribution = { path = "../umber-distribution" }
umber-vfs = { path = "../umber-vfs" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bincode.workspace = true
serde.workspace = true
umber-fetch = { path = "../umber-fetch" }
umber-hash = { path = "../umber-hash" }
umber-interrupt = { path = "../umber-interrupt" }

[target.'cfg(target_os = "linux")'.dependencies]
getrandom = "0.3"
rustix = { version = "1.1", features = ["event", "pipe", "process"] }
subtle = "2.6"
zeroize = "1.8"

[dev-dependencies]
parity-harness = { path = "../../tools/parity-harness" }
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
test-support = { path = "../test-support" }
tex-command-stream = { path = "../../tools/tex-command-stream" }
tex-state = { path = "../tex-state", features = ["testing"] }
ttf-parser = "0.25.1"

[lints]
workspace = true
