[package]
name = "tex-state"
version.workspace = true
edition.workspace = true

[features]
default = []
# Mirrors every environment write into an independent map for verification.
# This must remain production-like: it does not expose handle constructors.
shadow = []
# Test-only escape hatches for replay/fuzz coverage of raw storage words.
# Engine production builds must not enable this feature.
testing = []
# Compile-time counters for dedicated profiling builds. These are ephemeral
# process-wide allocation and derived-work counters that never participate in
# engine state.
profiling = ["dep:umber-hot-core-allocator"]

[dependencies]
ahash.workspace = true
bincode.workspace = true
chrono.workspace = true
flate2.workspace = true
serde.workspace = true
smallvec.workspace = true
tex-arith = { path = "../tex-arith" }
tex-content = { path = "../tex-content" }
tex-fonts = { path = "../tex-fonts" }
thin-dst.workspace = true
umber-hot-core-allocator = { path = "profiling-allocator", optional = true }
unicode-width.workspace = true

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
test-support = { path = "../test-support" }
