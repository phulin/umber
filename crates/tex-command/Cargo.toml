[package]
name = "tex-command"
version.workspace = true
edition.workspace = true

[features]
# Enables the command-owned semantic observation vocabulary. This
# deliberately pulls in no transport or oracle schema dependency, and an
# engine built with it must produce byte-identical artifacts to one without.
observe = []

[dependencies]
tex-fonts = { path = "../tex-fonts" }
tex-state = { path = "../tex-state" }

[dev-dependencies]
serde.workspace = true
test-support = { path = "../test-support" }
tex-oracle = { path = "../tex-oracle" }
tex-state = { path = "../tex-state", features = ["testing"] }

[lints]
workspace = true
